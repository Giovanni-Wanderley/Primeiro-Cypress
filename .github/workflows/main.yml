name: CI - Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    env:
      CYPRESS_ADOPET_EMAIL: ${{ secrets.ADOPET_EMAIL }}
      CYPRESS_ADOPET_SENHA: ${{ secrets.ADOPET_SENHA }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        if: ${{ env.CYPRESS_RECORD_KEY == '' }}
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome

      - name: Run Cypress tests with Cloud recording
        if: ${{ env.CYPRESS_RECORD_KEY != '' }}
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          record: true

      - name: Upload mochawesome reports (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-reports
          path: cypress/results
          if-no-files-found: warn

      - name: Upload Cypress videos and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-media
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore
